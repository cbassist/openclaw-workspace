[project]
name = "donna"
version = "0.1.0"
description = "Donna — Telegram ↔ Claude Code bridge with voice, Archon, and auto-poll"
requires-python = ">=3.13"
dependencies = [
    # Phase 1: Voice notes
    "python-telegram-bot>=21.0",
    "elevenlabs>=1.0",
    "httpx>=0.27",
    # Phase 2: Gateway + Mini App
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mcp>=1.0",
    # Telethon: persistent user-level Telegram session (MTProto)
    "telethon>=1.37",
    "cryptg>=0.4",  # faster crypto for Telethon
]

[tool.uv]
# Scripts-only project — no package to build
package = false
